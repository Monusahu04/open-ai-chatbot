<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark — chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">

  <header class="head">
    <div class="head-mark"></div>
    <div class="head-text">
      <span class="head-title">Spark</span>
      <span class="head-sub">gpt-oss-20b</span>
    </div>
    <div class="head-user">
      <span class="head-username">{{ username }}</span>
      <button type="button" id="logoutBtn" class="logout-btn">Log out</button>
    </div>
  </header>

  <section class="log" id="log">
    <div class="empty" id="empty">
      <h1>Ask anythig./h1>
      <p>they give you the best nswer    .</p>
    </div>
  </section>

  <form class="composer" id="composerForm">
    <textarea id="messageInput" placeholder="Apna message likho…" rows="1" maxlength="4000"></textarea>
    <button type="submit" class="send" id="sendBtn" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
